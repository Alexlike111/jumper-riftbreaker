    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: radial-gradient(circle at 50% 46%, #0b1326 0%, #05070d 72%);
        color: #f8fafc;
        font-family: ui-monospace, 'SFMono-Regular', 'Cascadia Mono', 'Roboto Mono', Menlo, Consolas, monospace;
        pointer-events: auto;
        transition: opacity 0.28s ease, visibility 0.28s ease;
      }
      #boot-loader.is-loaded {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .boot-rift-slit {
        position: relative;
        width: 8px;
        height: 68px;
        border-radius: 999px;
        background: #ffffff;
        box-shadow:
          0 0 16px #00f0ff,
          0 0 34px rgba(0, 240, 255, 0.72),
          3px 0 18px rgba(168, 85, 247, 0.75);
        animation: bootRiftPulse 0.9s ease-in-out infinite alternate;
      }
      .boot-loader-label {
        font-size: 0.76rem;
        font-weight: 700;
        letter-spacing: 0.24em;
        color: #00f0ff;
        text-shadow: 0 0 14px rgba(0, 240, 255, 0.6);
      }
      @keyframes bootRiftPulse {
        from {
          transform: scaleY(0.76) scaleX(0.85);
          opacity: 0.78;
        }
        to {
          transform: scaleY(1.14) scaleX(1.18);
          opacity: 1;
        }
      }
    </style>

    <div id="boot-loader" role="status" aria-live="polite">

    </div>
    <canvas id="game-canvas" aria-label="Игровое поле ТЕЛЕПОРТ: РАЗЛОМ"></canvas>
